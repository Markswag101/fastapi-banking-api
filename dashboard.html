<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banking Dashboard — Mark Momoh</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #dbeafe; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #1e40af; flex-shrink:0; }
.brand { font-size: 15px; font-weight: 600; color: #111; }
.brand-sub { font-size: 12px; color: #666; font-family: monospace; }
.badge-live { font-size: 11px; background: #dcfce7; color: #166534; padding: 3px 10px; border-radius: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 2rem; }
.metric { background: #fff; border-radius: 10px; padding: 1rem; border: 1px solid #e5e7eb; }
.metric-label { font-size: 11px; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.metric-value { font-size: 20px; font-weight: 600; color: #111; }
.section-title { font-size: 11px; font-weight: 600; color: #666; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 2rem; }
.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem; }
.card-title { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 14px; }
.form-row { margin-bottom: 10px; }
.form-label { font-size: 12px; color: #555; margin-bottom: 4px; display: block; }
input { width: 100%; font-size: 14px; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 7px; outline: none; background: #fff; color: #111; }
input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
.btn { width: 100%; margin-top: 10px; font-size: 13px; padding: 9px; cursor: pointer; border-radius: 7px; border: none; font-weight: 600; }
.btn-success { background: #dcfce7; color: #166534; }
.btn-success:hover { background: #bbf7d0; }
.btn-danger { background: #fee2e2; color: #991b1b; }
.btn-danger:hover { background: #fecaca; }
.btn-info { background: #dbeafe; color: #1e40af; }
.btn-info:hover { background: #bfdbfe; }
.btn-primary { background: #6366f1; color: #fff; }
.btn-primary:hover { background: #4f46e5; }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
th { font-weight: 600; color: #666; text-align: left; padding: 8px 6px; border-bottom: 1px solid #e5e7eb; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
td { padding: 10px 6px; border-bottom: 1px solid #f3f4f6; color: #111; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 500; }
.pill-deposit { background: #dcfce7; color: #166534; }
.pill-withdrawal { background: #fee2e2; color: #991b1b; }
.pill-transfer { background: #dbeafe; color: #1e40af; }
.pill-success { background: #dcfce7; color: #166534; }
.amt-credit { color: #166534; font-weight: 600; }
.amt-debit { color: #991b1b; font-weight: 600; }
.msg { font-size: 13px; padding: 8px 10px; border-radius: 7px; margin-top: 10px; display: none; }
.msg-ok { background: #dcfce7; color: #166534; }
.msg-err { background: #fee2e2; color: #991b1b; }
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 2rem; width: 100%; max-width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
.login-title { font-size: 18px; font-weight: 700; margin-bottom: 1.5rem; color: #111; }
.login-sub { font-size: 13px; color: #666; margin-bottom: 1.2rem; }
.tabs { display: flex; margin-bottom: 1.5rem; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
.tab { flex: 1; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: #f9fafb; color: #666; }
.tab.active { background: #6366f1; color: #fff; }
</style>
</head>
<body>

<div id="login-view" class="login-wrap">
  <div class="login-card">
    <div class="login-title">🏦 Banking Dashboard</div>
    <div class="login-sub">Powered by FastAPI + PostgreSQL</div>
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>
    <div id="login-form">
      <div class="form-row">
        <label class="form-label">Email</label>
        <input type="email" id="login-email" placeholder="markmomoh@yopmail.com" />
      </div>
      <div class="form-row">
        <label class="form-label">Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" />
      </div>
      <div class="msg msg-err" id="login-err"></div>
      <button class="btn btn-primary" onclick="doLogin()">Sign in</button>
    </div>

    <div id="register-form" style="display:none;">
      <div class="form-row">
        <label class="form-label">Full name</label>
        <input type="text" id="reg-name" placeholder="Mark Momoh" />
      </div>
      <div class="form-row">
        <label class="form-label">Email</label>
        <input type="email" id="reg-email" placeholder="mark@example.com" />
      </div>
      <div class="form-row">
        <label class="form-label">Phone</label>
        <input type="text" id="reg-phone" placeholder="+2348012345678" />
      </div>
      <div class="form-row">
        <label class="form-label">Password</label>
        <input type="password" id="reg-pass" placeholder="Min 6 characters" />
      </div>
      <div class="msg msg-ok" id="reg-ok"></div>
      <div class="msg msg-err" id="reg-err"></div>
      <button class="btn btn-primary" onclick="doRegister()">Create account</button>
    </div>
  </div>
</div>

<div id="main-view" style="display:none;">
  <div class="container">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="avatar">MM</div>
        <div>
          <div class="brand">Mark Momoh</div>
          <div class="brand-sub" id="acct-display">Loading...</div>
        </div>
      </div>
      <span class="badge-live">● Live</span>
    </div>

    <div class="cards">
      <div class="metric">
        <div class="metric-label">Balance</div>
        <div class="metric-value" id="balance-val">—</div>
        <div style="font-size:11px;color:#666;margin-top:4px;" id="currency-val">NGN</div>
      </div>
      <div class="metric">
        <div class="metric-label">Total deposits</div>
        <div class="metric-value" id="total-deposits">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Total withdrawals</div>
        <div class="metric-value" id="total-withdrawals">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Transactions</div>
        <div class="metric-value" id="txn-count">—</div>
      </div>
    </div>

    <div style="margin-bottom:2rem;">
      <div class="section-title">Actions</div>
      <div class="grid2">
        <div class="card">
          <div class="card-title">Deposit</div>
          <div class="form-row"><label class="form-label">Amount (NGN)</label><input type="number" id="dep-amount" placeholder="e.g. 10000" min="1" /></div>
          <div class="form-row"><label class="form-label">Description</label><input type="text" id="dep-desc" placeholder="e.g. Salary" /></div>
          <button class="btn btn-success" onclick="doDeposit()">+ Deposit funds</button>
          <div class="msg msg-ok" id="dep-ok"></div>
          <div class="msg msg-err" id="dep-err"></div>
        </div>
        <div class="card">
          <div class="card-title">Withdraw</div>
          <div class="form-row"><label class="form-label">Amount (NGN)</label><input type="number" id="wd-amount" placeholder="e.g. 5000" min="1" /></div>
          <div class="form-row"><label class="form-label">Description</label><input type="text" id="wd-desc" placeholder="e.g. ATM withdrawal" /></div>
          <button class="btn btn-danger" onclick="doWithdraw()">- Withdraw funds</button>
          <div class="msg msg-ok" id="wd-ok"></div>
          <div class="msg msg-err" id="wd-err"></div>
        </div>
      </div>
    </div>

    <div style="margin-bottom:2rem;">
      <div class="section-title">Transfer funds</div>
      <div class="card">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div><label class="form-label">Receiver account number</label><input type="text" id="tr-acct" placeholder="10-digit number" maxlength="10" /></div>
          <div><label class="form-label">Amount (NGN)</label><input type="number" id="tr-amount" placeholder="e.g. 2000" min="1" /></div>
          <div><label class="form-label">Description</label><input type="text" id="tr-desc" placeholder="e.g. Rent" /></div>
        </div>
        <button class="btn btn-info" style="margin-top:12px;" onclick="doTransfer()">Send transfer</button>
        <div id="register-form" style="display:none;">
  <div class="form-row">
    <label class="form-label">Full name</label>
    <input type="text" id="reg-name" placeholder="Mark Momoh" />
  </div>
  <div class="form-row">
    <label class="form-label">Email</label>
    <input type="email" id="reg-email" placeholder="mark@example.com" />
  </div>
  <div class="form-row">
    <label class="form-label">Phone</label>
    <input type="text" id="reg-phone" placeholder="+2348012345678" />
  </div>
  <div class="form-row">
    <label class="form-label">Password</label>
    <input type="password" id="reg-pass" placeholder="Min 6 characters" />
  </div>
  <div class="msg msg-ok" id="reg-ok"></div>
  <div class="msg msg-err" id="reg-err"></div>
  <button class="btn btn-primary" onclick="doRegister()">Create account</button>
</div>
        <div class="msg msg-ok" id="tr-ok"></div>
        <div class="msg msg-err" id="tr-err"></div>
      </div>
    </div>

    <div>
      <div class="section-title">Transaction history</div>
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th style="width:30%">Reference</th>
              <th style="width:18%">Type</th>
              <th style="width:20%">Amount</th>
              <th style="width:14%">Status</th>
              <th style="width:18%">Date</th>
            </tr>
          </thead>
          <tbody id="txn-body">
            <tr><td colspan="5" style="color:#999;text-align:center;padding:20px;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const BASE = 'https://web-production-72bd0.up.railway.app/api/v1';
function switchTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
}
let token = '', accountNumber = '';

function showMsg(id, msg, isOk) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'msg ' + (isOk ? 'msg-ok' : 'msg-err');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) { showMsg('login-err', 'Enter email and password', false); return; }
  try {
    const fd = new FormData();
    fd.append('username', email);
    fd.append('password', pass);
    const res = await fetch(`${BASE}/auth/login`, { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) { showMsg('login-err', data.detail || 'Login failed', false); return; }
    token = data.access_token;
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('main-view').style.display = 'block';
    await loadAccount();
  } catch(e) { showMsg('login-err', 'Cannot connect. Make sure the API server is running.', false); }
}

async function loadAccount() {
  const res = await fetch(`${BASE}/accounts/`, { headers: { Authorization: `Bearer ${token}` } });
  const accounts = await res.json();
  if (!accounts.length) return;
  const acc = accounts[0];
  accountNumber = acc.account_number;
  document.getElementById('acct-display').textContent = acc.account_number;
  document.getElementById('balance-val').textContent = '₦' + Number(acc.balance).toLocaleString('en-NG', {minimumFractionDigits:2, maximumFractionDigits:2});
  document.getElementById('currency-val').textContent = acc.currency;
  await loadHistory();
}

async function loadHistory() {
  const res = await fetch(`${BASE}/transactions/history/${accountNumber}`, { headers: { Authorization: `Bearer ${token}` } });
  const data = await res.json();
  document.getElementById('txn-count').textContent = data.total_transactions;
  let deps = 0, wds = 0;
  const rows = data.transactions.map(t => {
    if (t.transaction_type === 'deposit') deps += t.amount;
    if (t.transaction_type === 'withdrawal') wds += t.amount;
    const amtClass = t.transaction_type === 'deposit' ? 'amt-credit' : 'amt-debit';
    const amtPrefix = t.transaction_type === 'deposit' ? '+' : '-';
    const date = new Date(t.created_at).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'2-digit'});
    return `<tr>
      <td style="font-family:monospace;font-size:11px;">${t.reference}</td>
      <td><span class="pill pill-${t.transaction_type}">${t.transaction_type}</span></td>
      <td class="${amtClass}">${amtPrefix}₦${Number(t.amount).toLocaleString('en-NG',{minimumFractionDigits:2})}</td>
      <td><span class="pill pill-${t.status}">${t.status}</span></td>
      <td style="color:#666;">${date}</td>
    </tr>`;
  }).join('');
  document.getElementById('txn-body').innerHTML = rows || '<tr><td colspan="5" style="color:#999;text-align:center;padding:20px;">No transactions yet</td></tr>';
  document.getElementById('total-deposits').textContent = '₦' + deps.toLocaleString('en-NG',{minimumFractionDigits:2});
  document.getElementById('total-withdrawals').textContent = '₦' + wds.toLocaleString('en-NG',{minimumFractionDigits:2});
}

async function doDeposit() {
  const amount = parseFloat(document.getElementById('dep-amount').value);
  const description = document.getElementById('dep-desc').value || 'Deposit';
  if (!amount || amount <= 0) { showMsg('dep-err', 'Enter a valid amount', false); return; }
  try {
    const res = await fetch(`${BASE}/accounts/${accountNumber}/deposit`, {
      method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, description })
    });
    const data = await res.json();
    if (!res.ok) { showMsg('dep-err', data.detail || 'Deposit failed', false); return; }
    showMsg('dep-ok', `₦${amount.toLocaleString()} deposited successfully`, true);
    document.getElementById('dep-amount').value = '';
    document.getElementById('dep-desc').value = '';
    await loadAccount();
  } catch(e) { showMsg('dep-err', 'Request failed', false); }
}

async function doWithdraw() {
  const amount = parseFloat(document.getElementById('wd-amount').value);
  const description = document.getElementById('wd-desc').value || 'Withdrawal';
  if (!amount || amount <= 0) { showMsg('wd-err', 'Enter a valid amount', false); return; }
  try {
    const res = await fetch(`${BASE}/accounts/${accountNumber}/withdraw`, {
      method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, description })
    });
    const data = await res.json();
    if (!res.ok) { showMsg('wd-err', data.detail || 'Withdrawal failed', false); return; }
    showMsg('wd-ok', `₦${amount.toLocaleString()} withdrawn successfully`, true);
    document.getElementById('wd-amount').value = '';
    document.getElementById('wd-desc').value = '';
    await loadAccount();
  } catch(e) { showMsg('wd-err', 'Request failed', false); }
}

async function doTransfer() {
  const receiver_account_number = document.getElementById('tr-acct').value.trim();
  const amount = parseFloat(document.getElementById('tr-amount').value);
  const description = document.getElementById('tr-desc').value || 'Transfer';
  if (!receiver_account_number || receiver_account_number.length !== 10) { showMsg('tr-err', 'Enter a valid 10-digit account number', false); return; }
  if (!amount || amount <= 0) { showMsg('tr-err', 'Enter a valid amount', false); return; }
  try {
    const res = await fetch(`${BASE}/transactions/transfer`, {
      method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ receiver_account_number, amount, description })
    });
    const data = await res.json();
    if (!res.ok) { showMsg('tr-err', data.detail || 'Transfer failed', false); return; }
    showMsg('tr-ok', `₦${amount.toLocaleString()} sent successfully`, true);
    document.getElementById('tr-acct').value = '';
    document.getElementById('tr-amount').value = '';
    document.getElementById('tr-desc').value = '';
    await loadAccount();
  } catch(e) { showMsg('tr-err', 'Request failed', false); }
}

document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
